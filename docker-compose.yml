services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hybrid-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hybrid-rag-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped